<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여울귀신 참석 현황</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #f8fafc;
    }
    .card-3d {
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-bottom: 3px solid #cbd5e1;
    }
    .btn-3d-primary {
      box-shadow: 0 4px 0 0 #c2410c;
    }
    .btn-3d-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #c2410c;
    }
    .btn-3d-light {
      box-shadow: 0 3px 0 0 #cbd5e1;
    }
    .btn-3d-light:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #cbd5e1;
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen p-4 sm:p-6 md:p-8 antialiased text-sm sm:text-base">
  <div class="max-w-7xl mx-auto space-y-5 sm:space-y-7">
    
    <!-- 상단 연한 파스텔 주황 그라데이션 히어로 헤더 & 컨트롤 바 -->
    <header class="bg-gradient-to-r from-amber-100 via-orange-200 to-amber-200 text-amber-950 p-5 sm:p-8 rounded-3xl shadow-xl shadow-orange-900/5 flex flex-col gap-5 border border-white/60 border-b-4 border-b-orange-300">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/70 border border-white flex items-center justify-center text-3xl sm:text-4xl shadow-inner backdrop-blur-md">
            🏸
          </div>
          <div>
            <div class="flex items-center gap-2.5">
              <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-amber-950">여울귀신 참석 현황</h1>
              <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-orange-500 text-white shadow-sm">LIVE</span>
            </div>
            <p class="text-xs sm:text-sm text-amber-900/80 mt-1 font-semibold">구글 캘린더 일정을 실시간 분석합니다.</p>
          </div>
        </div>
      </div>

      <!-- 상단 컨트롤 바 (조회기간 바로 옆에 조회하기 버튼 배치) -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white/60 p-4 rounded-2xl border border-white/80 backdrop-blur-md shadow-sm">
        <div class="flex flex-wrap items-center justify-between sm:justify-start gap-3 w-full sm:w-auto">
          <span class="font-bold text-amber-950 shrink-0 flex items-center gap-2 text-sm">
            <span class="w-3 h-3 rounded-full bg-orange-500 shadow-sm"></span> 조회 기간
          </span>
          <div class="flex items-center gap-2 flex-1 sm:flex-initial">
            <input type="month" id="startMonthInput" class="w-full sm:w-auto px-3.5 py-2.5 bg-white border border-amber-200 rounded-xl text-sm text-slate-800 font-bold outline-none focus:ring-2 focus:ring-orange-400 transition shadow-inner">
            <span class="text-amber-900 font-bold">~</span>
            <input type="month" id="endMonthInput" class="w-full sm:w-auto px-3.5 py-2.5 bg-white border border-amber-200 rounded-xl text-sm text-slate-800 font-bold outline-none focus:ring-2 focus:ring-orange-400 transition shadow-inner">
          </div>
          <button onclick="loadCalendarData()" class="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-xl text-sm flex items-center justify-center gap-1.5 btn-3d-primary transition shrink-0 ml-1">
            <span>조회하기</span>
          </button>
        </div>
        <div class="flex items-center justify-end sm:ml-auto">
          <button onclick="toggleConfig()" class="w-full sm:w-auto px-5 py-2.5 bg-white hover:bg-amber-50 text-amber-900 font-bold rounded-xl text-sm flex items-center justify-center btn-3d-light transition border border-amber-200">
            ⚙️ API 설정
          </button>
        </div>
      </div>
    </header>

    <!-- API 설정 입력 창 -->
    <div id="configSection" class="hidden card-3d p-6 sm:p-7 rounded-3xl space-y-4 transition-all">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
          <span>🔧 Google Calendar API 연동 설정</span>
        </h2>
        <span class="text-xs text-slate-400 hidden sm:inline">입력된 키는 브라우저에 보관됩니다.</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">Google API Key</label>
          <input type="text" id="apiKeyInput" placeholder="발급받은 API 키 입력" class="w-full p-3.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-orange-400 outline-none transition shadow-inner">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">Calendar ID</label>
          <input type="text" id="calendarIdInput" placeholder="예: xxx@group.calendar.google.com" class="w-full p-3.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-orange-400 outline-none transition shadow-inner">
        </div>
      </div>
      <div class="flex justify-end pt-2">
        <button onclick="loadCalendarData()" class="w-full sm:w-auto px-6 py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-xl text-sm btn-3d-primary transition">
          저장 및 데이터 새로고침
        </button>
      </div>
    </div>

    <!-- 핵심 지표 카드 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
      <div class="card-3d p-6 rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-orange-500">
        <div>
          <p class="text-xs sm:text-sm font-bold text-orange-600 uppercase tracking-wider">조회된 총 일정</p>
          <p id="totalEvents" class="text-3xl sm:text-4xl font-black text-slate-800 mt-2 tracking-tight">0<span class="text-lg font-bold text-orange-500 ml-1">건</span></p>
        </div>
        <div class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-orange-200">📋</div>
      </div>

      <div class="card-3d p-6 rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-emerald-500">
        <div>
          <p class="text-xs sm:text-sm font-bold text-emerald-600 uppercase tracking-wider">총 고유 참석자</p>
          <p id="totalAttendees" class="text-3xl sm:text-4xl font-black text-slate-800 mt-2 tracking-tight">0<span class="text-lg font-bold text-emerald-500 ml-1">명</span></p>
        </div>
        <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-emerald-200">👥</div>
      </div>

      <div class="card-3d p-6 rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-amber-500">
        <div>
          <p class="text-xs sm:text-sm font-bold text-amber-600 uppercase tracking-wider">최다 참석자</p>
          <p id="topAttendee" class="text-xl sm:text-2xl font-black text-amber-600 mt-2 truncate max-w-[180px] sm:max-w-[200px] tracking-tight">-</p>
        </div>
        <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-amber-200">🏆</div>
      </div>
    </div>

    <!-- 시각화 차트 그리드 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="card-3d p-6 rounded-3xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-orange-500"></span> 월별 시간대별 일정 현황
          </h3>
          <span class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-lg border border-orange-200 shadow-sm">18시 / 20시 비교</span>
        </div>
        <div class="relative h-[230px] sm:h-[260px]">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>

      <div class="card-3d p-6 rounded-3xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span> 참석 횟수 Top 10
          </h3>
          <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg border border-emerald-200 shadow-sm">상위 순위</span>
        </div>
        <div class="relative h-[230px] sm:h-[260px]">
          <canvas id="attendeeChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 회원 참석자별 상세 목록 테이블 -->
    <div class="card-3d rounded-3xl overflow-hidden">
      <div class="p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50/80">
        <h3 class="text-sm sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
          <span>👤 회원 참석자별 집계 목록</span>
        </h3>
        <span class="text-xs font-bold text-slate-400">실시간 파싱 완료</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-700">
          <thead class="bg-slate-100 text-slate-600 font-extrabold uppercase tracking-wider text-xs border-b border-slate-200">
            <tr>
              <th class="p-4 sm:p-5 w-24 sm:w-28 text-center">순위</th>
              <th class="p-4 sm:p-5">이름</th>
              <th class="p-4 sm:p-5 text-center">최근 참석일</th>
              <th class="p-4 sm:p-5 text-right pr-6 sm:pr-8">참석 횟수</th>
            </tr>
          </thead>
          <tbody id="attendeeTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="p-10 text-center text-slate-400 font-medium">데이터가 없습니다. 상단에서 API 설정 후 데이터를 조회해 주세요.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let monthlyChartInstance = null;
    let attendeeChartInstance = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gcal_api_key');
      const savedCalId = localStorage.getItem('gcal_id');
      const savedStartMonth = localStorage.getItem('gcal_start_month');
      const savedEndMonth = localStorage.getItem('gcal_end_month');

      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      if (savedCalId) document.getElementById('calendarIdInput').value = savedCalId;
      
      const now = new Date();
      
      if (savedEndMonth) {
        document.getElementById('endMonthInput').value = savedEndMonth;
      } else {
        document.getElementById('endMonthInput').value = formatYearMonth(now);
      }

      if (savedStartMonth) {
        document.getElementById('startMonthInput').value = savedStartMonth;
      } else {
        const threeMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 2, 1);
        document.getElementById('startMonthInput').value = formatYearMonth(threeMonthsAgo);
      }

      if (savedKey && savedCalId) loadCalendarData();
    };

    function formatYearMonth(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }

    function toggleConfig() {
      const sec = document.getElementById('configSection');
      sec.classList.toggle('hidden');
    }

    async function loadCalendarData() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const calendarId = document.getElementById('calendarIdInput').value.trim();
      const startMonth = document.getElementById('startMonthInput').value;
      const endMonth = document.getElementById('endMonthInput').value;

      if (!apiKey || !calendarId) {
        document.getElementById('configSection').classList.remove('hidden');
        alert('Google API Key와 Calendar ID를 모두 입력해 주세요.');
        return;
      }

      localStorage.setItem('gcal_api_key', apiKey);
      localStorage.setItem('gcal_id', calendarId);
      localStorage.setItem('gcal_start_month', startMonth);
      localStorage.setItem('gcal_end_month', endMonth);

      let timeMinParam = '';
      let timeMaxParam = '';

      if (startMonth) {
        const startDate = new Date(`${startMonth}-01T00:00:00Z`);
        timeMinParam = `&timeMin=${startDate.toISOString()}`;
      }

      if (endMonth) {
        const parts = endMonth.split('-');
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        const endDate = new Date(year, month, 1, 0, 0, 0);
        timeMaxParam = `&timeMax=${endDate.toISOString()}`;
      }

      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?key=${apiKey}&maxResults=2500&singleEvents=true&orderBy=startTime${timeMinParam}${timeMaxParam}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('데이터를 불러오지 못했습니다. 캘린더 공개 범위 및 API 키 설정을 확인하세요.');
        
        const data = await res.json();
        processCalendarData(data.items || []);
        document.getElementById('configSection').classList.add('hidden');
      } catch (err) {
        alert(err.message);
      }
    }

    function processCalendarData(events) {
      document.getElementById('totalEvents').innerHTML = `${events.length}<span class="text-base font-bold text-orange-500 ml-1">건</span>`;

      const monthlyTimeCount = {}; // { 'YYYY-MM': { '18시': count, '20시': count } }
      const attendeeData = {}; 

      events.forEach(evt => {
        const startRaw = evt.start?.dateTime || evt.start?.date;
        if (!startRaw) return;

        const eventDateObj = new Date(startRaw);
        const monthKey = startRaw.substring(0, 7);
        
        if (!monthlyTimeCount[monthKey]) {
          monthlyTimeCount[monthKey] = { '18시': 0, '20시': 0 };
        }

        const hour = eventDateObj.getHours();
        if (hour >= 19) {
          monthlyTimeCount[monthKey]['20시'] += 1;
        } else {
          monthlyTimeCount[monthKey]['18시'] += 1;
        }

        const yy = String(eventDateObj.getFullYear()).substring(2);
        const mm = String(eventDateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(eventDateObj.getDate()).padStart(2, '0');
        const formattedDate = `${yy}.${mm}.${dd}`;

        const title = evt.summary || '';
        if (!title) return;

        const cleanTitle = title.replace(/\([^)]*\)/g, "");
        
        const tokens = cleanTitle.split(/[,/\s]+/);
        tokens.forEach(token => {
          const name = token.trim();
          
          const isTimeOrDateCode = /[월화수목금토일]\d/.test(name) || name.includes('/') || /^\d+$/.test(name) || name.includes(':');
          const isGuestKeyword = name.includes('게스트') || name === '게스트';

          if (name && !isTimeOrDateCode && !isGuestKeyword && name.length >= 2) {
            if (!attendeeData[name]) {
              attendeeData[name] = { count: 0, lastDate: formattedDate, lastTimestamp: eventDateObj.getTime() };
            }
            attendeeData[name].count += 1;
            
            if (eventDateObj.getTime() >= attendeeData[name].lastTimestamp) {
              attendeeData[name].lastDate = formattedDate;
              attendeeData[name].lastTimestamp = eventDateObj.getTime();
            }
          }
        });
      });

      const sortedAttendees = Object.entries(attendeeData).sort((a, b) => b[1].count - a[1].count);

      document.getElementById('totalAttendees').innerHTML = `${sortedAttendees.length}<span class="text-base font-bold text-emerald-500 ml-1">명</span>`;
      document.getElementById('topAttendee').innerText = sortedAttendees[0] ? `${sortedAttendees[0][0]} (${sortedAttendees[0][1].count}회)` : '-';

      renderTable(sortedAttendees);
      renderCharts(monthlyTimeCount, sortedAttendees);
    }

    function renderTable(memberList) {
      const tbody = document.getElementById('attendeeTableBody');
      tbody.innerHTML = '';
      if (memberList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400 font-medium">조회된 기간 내 인식된 참석자가 없습니다.</td></tr>';
        return;
      }
      memberList.forEach(([name, data], idx) => {
        let rankBadge = `<span class="inline-flex items-center justify-center w-8 h-8 rounded-full text-xs font-bold bg-slate-200 text-slate-600 shadow-inner">${idx + 1}</span>`;
        let rowBg = "hover:bg-slate-50";

        if (idx === 0) {
          rankBadge = `<span class="inline-flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-2xl text-xl sm:text-2xl font-bold bg-gradient-to-b from-amber-100 to-amber-200 text-amber-800 shadow-md border-2 border-amber-300">🥇</span>`;
          rowBg = "bg-amber-50/40 hover:bg-amber-50/60";
        } else if (idx === 1) {
          rankBadge = `<span class="inline-flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-2xl text-xl sm:text-2xl font-bold bg-gradient-to-b from-slate-100 to-slate-200 text-slate-700 shadow-md border-2 border-slate-300">🥈</span>`;
        } else if (idx === 2) {
          rankBadge = `<span class="inline-flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-2xl text-xl sm:text-2xl font-bold bg-gradient-to-b from-orange-100 to-orange-200 text-orange-800 shadow-md border-2 border-orange-300">🥉</span>`;
        }

        tbody.innerHTML += `
          <tr class="${rowBg} transition-colors duration-150">
            <td class="p-4 sm:p-4.5 text-center flex items-center justify-center">${rankBadge}</td>
            <td class="p-4 sm:p-4.5 font-bold text-slate-800 text-sm sm:text-base">${name}</td>
            <td class="p-4 sm:p-4.5 text-center">
              <span class="inline-block px-3 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold border border-slate-200 shadow-inner">${data.lastDate}</span>
            </td>
            <td class="p-4 sm:p-4.5 font-black text-orange-600 text-right pr-6 sm:pr-8 text-sm sm:text-base">${data.count}<span class="text-xs font-bold text-slate-400 ml-1">회</span></td>
          </tr>
        `;
      });
    }

    function renderCharts(monthlyTimeCount, attendeeList) {
      const mCtx = document.getElementById('monthlyChart').getContext('2d');
      const aCtx = document.getElementById('attendeeChart').getContext('2d');

      if (monthlyChartInstance) monthlyChartInstance.destroy();
      if (attendeeChartInstance) attendeeChartInstance.destroy();

      const sortedKeys = Object.keys(monthlyTimeCount).sort();
      
      const mLabels = sortedKeys.map(k => {
        const parts = k.split('-');
        if (parts.length === 2) {
          return parts[0].substring(2) + '.' + parts[1];
        }
        return k;
      });

      const data18h = sortedKeys.map(k => monthlyTimeCount[k]['18시']);
      const data20h = sortedKeys.map(k => monthlyTimeCount[k]['20시']);

      // 3D 입체 그라데이션 생성
      const grad18 = mCtx.createLinearGradient(0, 0, 0, 260);
      grad18.addColorStop(0, '#fb923c');
      grad18.addColorStop(1, '#ea580c');

      const grad20 = mCtx.createLinearGradient(0, 0, 0, 260);
      grad20.addColorStop(0, '#38bdf8');
      grad20.addColorStop(1, '#0284c7');

      monthlyChartInstance = new Chart(mCtx, {
        type: 'bar',
        data: {
          labels: mLabels,
          datasets: [
            {
              label: '18시',
              data: data18h,
              backgroundColor: grad18,
              borderRadius: 6,
              barPercentage: 0.4,
              categoryPercentage: 0.6
            },
            {
              label: '20시',
              data: data20h,
              backgroundColor: grad20,
              borderRadius: 6,
              barPercentage: 0.4,
              categoryPercentage: 0.6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              display: true, 
              position: 'top', 
              labels: { font: { family: 'Pretendard', weight: 'bold', size: 12 }, boxWidth: 12 } 
            } 
          },
          scales: {
            y: { grid: { color: '#e2e8f0' }, ticks: { font: { size: 11, family: 'Pretendard', weight: '600' }, color: '#64748b' } },
            x: { grid: { display: false }, ticks: { font: { size: 11, family: 'Pretendard', weight: '600' }, color: '#475569' } }
          }
        }
      });

      const top10 = attendeeList.slice(0, 10);
      
      const gradTop = aCtx.createLinearGradient(0, 0, 300, 0);
      gradTop.addColorStop(0, '#34d399');
      gradTop.addColorStop(1, '#059669');

      attendeeChartInstance = new Chart(aCtx, {
        type: 'bar',
        data: {
          labels: top10.map(i => i[0]),
          datasets: [{
            label: '참석 횟수',
            data: top10.map(i => i[1].count),
            backgroundColor: gradTop,
            borderRadius: 8,
            barPercentage: 0.55,
            categoryPercentage: 0.6
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
